name: Dependency lockfile and secret-history audit

on:
  push:
    branches: [security/prelaunch-audit-2026-11-07]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Generate lockfile and apply non-breaking fixes
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm audit fix --ignore-scripts --no-fund || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            if ! git diff --cached --quiet; then
              git commit -m "Add lockfile and apply safe dependency fixes"
              git push
            fi
            npm audit --audit-level=high
            if node -e 'const s=require("./package.json").scripts||{}; process.exit(s.test && !/no test specified/i.test(s.test) ? 0 : 1)'; then npm test; fi
            npm run build --if-present
          else
            echo "No package.json; dependency audit not applicable."
          fi
      - name: Scan full Git history with Gitleaks
        if: always()
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --log-opts=--all --redact --verbose --exit-code=1
